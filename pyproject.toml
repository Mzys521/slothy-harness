[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slothy"
version = "0.3.0"
description = "Slothy desktop agent Harness project skeleton"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pywebview>=5",
    "openai>=3",
    "python-dotenv>=1",
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"slothy.infrastructure.context" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
